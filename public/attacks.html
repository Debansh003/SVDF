<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attack Simulation — OS Security Framework</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main">
    <div id="topbar-mount"></div>
    <div class="page-content">

      <div class="page-section-title">Simulation Controls</div>

      <!-- Attack Grid -->
      <div class="attack-grid mb-6" id="attack-grid">
        <!-- filled by JS -->
      </div>

      <div class="grid-2" style="gap:20px;">
        <!-- Live Log Terminal -->
        <div class="card">
          <div class="card-header">
            <div class="card-icon" style="background:rgba(0,255,136,0.1); color:var(--green);">⬛</div>
            <div class="title">Attack Log Terminal</div>
            <button class="btn-cyber ghost" style="margin-left:auto; padding:4px 12px; font-size:11px;" onclick="clearTerminal()">Clear</button>
          </div>
          <div class="card-body" style="padding:0;">
            <div class="log-terminal" id="attack-terminal">
              <span class="log-entry info"><span class="ts">[SYSTEM]</span>Terminal ready. Awaiting attack simulation...<span class="cursor"></span></span>
            </div>
          </div>
        </div>

        <!-- Attack History Table -->
        <div class="card">
          <div class="card-header">
            <div class="card-icon" style="background:var(--red-glow); color:var(--red);">📋</div>
            <div class="title">Attack History</div>
            <button class="btn-cyber ghost" style="margin-left:auto; padding:4px 12px; font-size:11px;" onclick="loadHistory()">↻ Refresh</button>
          </div>
          <div class="card-body" style="padding:0; max-height:380px; overflow-y:auto;">
            <table class="table-cyber">
              <thead>
                <tr><th>Attack Type</th><th>Severity</th><th>Status</th><th>Target</th></tr>
              </thead>
              <tbody id="attack-history">
                <tr><td colspan="4" style="text-align:center; padding:24px; color:var(--text-muted);">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Stats row -->
      <div class="grid-4 mb-6 mt-6" id="attack-stats-row">
        <div class="stat-card red">
          <div class="stat-label">Critical</div>
          <div class="stat-value red" id="stat-critical">0</div>
          <div class="stat-icon-bg">🔴</div>
        </div>
        <div class="stat-card yellow">
          <div class="stat-label">High</div>
          <div class="stat-value yellow" id="stat-high">0</div>
          <div class="stat-icon-bg">🟡</div>
        </div>
        <div class="stat-card cyan">
          <div class="stat-label">Medium</div>
          <div class="stat-value cyan" id="stat-medium">0</div>
          <div class="stat-icon-bg">🔵</div>
        </div>
        <div class="stat-card green">
          <div class="stat-label">Blocked</div>
          <div class="stat-value green" id="stat-blocked">0</div>
          <div class="stat-icon-bg">✓</div>
        </div>
      </div>

    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    requireAuth();
    document.getElementById('sidebar-mount').innerHTML = renderSidebar('attacks');
    document.getElementById('topbar-mount').innerHTML  = renderTopbar('Attack Simulation', '10 attack types');

    const ATTACKS = [
      { id: 'buffer-overflow',     name: 'Buffer Overflow',          icon: '💥', severity: 'CRITICAL' },
      { id: 'trapdoor',            name: 'Trapdoor Attack',          icon: '🪤', severity: 'HIGH' },
      { id: 'backdoor',            name: 'Backdoor Attack',          icon: '🚪', severity: 'CRITICAL' },
      { id: 'cache-poisoning',     name: 'Cache Poisoning',          icon: '☠', severity: 'HIGH' },
      { id: 'malware',             name: 'Malware Injection',        icon: '🦠', severity: 'CRITICAL' },
      { id: 'deadlock',            name: 'Deadlock',                 icon: '🔒', severity: 'HIGH' },
      { id: 'cpu-starvation',      name: 'CPU Starvation',           icon: '🌡', severity: 'MEDIUM' },
      { id: 'unauthorized-access', name: 'Unauthorized Access',      icon: '👁', severity: 'HIGH' },
      { id: 'suspicious-ipc',      name: 'Suspicious IPC',           icon: '📡', severity: 'MEDIUM' },
      { id: 'memory-abuse',        name: 'Memory Abuse',             icon: '🧠', severity: 'HIGH' },
    ];

    // Render attack buttons
    document.getElementById('attack-grid').innerHTML = ATTACKS.map(a => `
      <button class="attack-btn" id="btn-${a.id}" onclick="simulate('${a.id}', '${a.name}')">
        <div class="attack-icon">${a.icon}</div>
        <div class="attack-name">${a.name}</div>
        <div class="attack-severity">${a.severity}</div>
      </button>
    `).join('');

    async function simulate(id, name) {
      const btn = document.getElementById('btn-' + id);
      btn.classList.add('simulating');
      btn.disabled = true;

      logToTerminal('attack-terminal', `Initiating ${name} simulation...`, 'warning');

      const res = await apiPost(`/attacks/simulate/${id}`, { target: `PID-${Math.floor(Math.random()*9000)+1000}` });

      btn.classList.remove('simulating');
      btn.disabled = false;

      if (res?.ok) {
        const d = res.data.data || res.data;
        logToTerminal('attack-terminal', `✓ ${name} simulated → status: ${d.status || 'DETECTED'}`, 'critical');
        logToTerminal('attack-terminal', `  Target: ${d.target || 'system'} | Severity: ${d.severity || 'HIGH'}`, 'info');
        showToast(`${name} simulated — ${d.severity || 'HIGH'} severity`, 'error');
        loadHistory();
        loadStats();
      } else {
        logToTerminal('attack-terminal', `✗ Simulation failed: ${res?.data?.message || 'error'}`, 'warning');
        showToast('Simulation failed', 'warning');
      }
    }

    async function loadHistory() {
      const res = await apiGet('/attacks?limit=20');
      const attacks = res?.data?.data || res?.data || [];
      const tbody = document.getElementById('attack-history');
      if (!Array.isArray(attacks) || !attacks.length) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--text-muted);">No attacks yet. Click buttons above to simulate.</td></tr>`;
        return;
      }
      tbody.innerHTML = attacks.map(a => `
        <tr>
          <td class="text-bright">${a.attackType || a.type}</td>
          <td>${severityBadge(a.severity)}</td>
          <td>${statusBadge(a.status)}</td>
          <td class="mono text-xs text-muted-c">${a.target || '—'}</td>
        </tr>
      `).join('');
    }

    async function loadStats() {
      const res = await apiGet('/attacks/stats');
      if (!res?.ok) return;
      const d = res.data.data || res.data;
      const sev = d.bySeverity || {};
      const sta = d.byStatus  || {};
      document.getElementById('stat-critical').textContent = sev.CRITICAL || 0;
      document.getElementById('stat-high').textContent     = sev.HIGH     || 0;
      document.getElementById('stat-medium').textContent   = sev.MEDIUM   || 0;
      document.getElementById('stat-blocked').textContent  = sta.BLOCKED  || 0;
    }

    function clearTerminal() {
      document.getElementById('attack-terminal').innerHTML =
        `<span class="log-entry info"><span class="ts">[SYSTEM]</span>Terminal cleared.<span class="cursor"></span></span>`;
    }

    loadHistory();
    loadStats();
  </script>
</body>
</html>

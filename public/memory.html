<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Management — OS Security Framework</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .algo-pill {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 18px; cursor: pointer;
      transition: all 0.2s; font-size: 12px; font-weight: 600;
      color: var(--text-muted); display: inline-block;
    }
    .algo-pill:hover, .algo-pill.active {
      border-color: var(--green); color: var(--green); background: var(--green-glow);
    }
    .page-frame {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 6px; font-size: 13px;
      font-weight: 700; font-family: var(--font-mono); transition: all 0.3s;
      border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted);
    }
    .page-frame.fault { border-color: var(--red); background: var(--red-glow); color: var(--red); }
    .page-frame.hit   { border-color: var(--green); background: var(--green-glow); color: var(--green); }
    .trace-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .trace-label { font-family: var(--font-mono); font-size: 12px; color: var(--cyan); width: 24px; text-align: center; }
    .seg-bar {
      height: 36px; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #000; border-radius: 4px;
      transition: all 0.3s; min-width: 40px;
    }
    .fault-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
    .fault-badge.fault { background: var(--red-glow); color: var(--red); border: 1px solid var(--red); }
    .fault-badge.hit   { background: var(--green-glow); color: var(--green); border: 1px solid var(--green); }
  </style>
</head>
<body>
  <div id="sidebar-mount"></div>
  <div class="main">
    <div id="topbar-mount"></div>
    <div class="page-content">

      <div class="page-section-title">Memory Management</div>

      <!-- Tabs -->
      <div style="display:flex; gap:10px; margin-bottom:24px;">
        <div class="algo-pill active" id="tab-paging" onclick="switchTab('paging')">📄 Page Replacement</div>
        <div class="algo-pill" id="tab-segmentation" onclick="switchTab('segmentation')">🗂 Segmentation</div>
        <div class="algo-pill" id="tab-virtual" onclick="switchTab('virtual')">💾 Virtual Memory</div>
      </div>

      <!-- PAGING TAB -->
      <div id="tab-paging-content">
        <div class="grid-2" style="gap:20px;">
          <div class="card">
            <div class="card-header">
              <div class="card-icon" style="background:var(--green-glow);color:var(--green);">📄</div>
              <div class="title">Page Replacement Configuration</div>
            </div>
            <div class="card-body">
              <div class="form-group" style="margin-bottom:14px;">
                <label class="form-label-cyber">Algorithm</label>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                  <div class="algo-pill active" id="alg-fifo" onclick="selectAlgo('FIFO')">FIFO</div>
                  <div class="algo-pill" id="alg-lru" onclick="selectAlgo('LRU')">LRU</div>
                  <div class="algo-pill" id="alg-optimal" onclick="selectAlgo('OPTIMAL')">Optimal</div>
                </div>
              </div>
              <div class="form-group" style="margin-bottom:14px;">
                <label class="form-label-cyber">Number of Frames</label>
                <input id="num-frames" type="number" class="form-control-cyber" value="3" min="1" max="8" />
              </div>
              <div class="form-group" style="margin-bottom:14px;">
                <label class="form-label-cyber">Page Reference String (comma or space separated)</label>
                <input id="page-string" class="form-control-cyber" value="1,2,3,4,1,2,5,1,2,3,4,5" placeholder="e.g. 1 2 3 4 1 2 5" />
              </div>
              <div style="display:flex; gap:8px;">
                <button class="btn-cyber primary" style="flex:1;justify-content:center;" onclick="runPaging()">▶ Simulate</button>
                <button class="btn-cyber ghost" onclick="loadDemoPages()">Load Demo</button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-icon" style="background:var(--cyan-glow);color:var(--cyan);">📊</div>
              <div class="title">Results</div>
            </div>
            <div class="card-body" id="paging-stats">
              <div style="text-align:center;padding:40px;color:var(--text-muted);">Run simulation to see results</div>
            </div>
          </div>
        </div>

        <div class="card" style="margin-top:20px;" id="trace-card" style="display:none;">
          <div class="card-header">
            <div class="card-icon" style="background:var(--purple-glow,rgba(153,102,255,0.15));color:var(--purple);">🔍</div>
            <div class="title">Page Replacement Trace</div>
          </div>
          <div class="card-body" style="overflow-x:auto;">
            <div id="paging-trace"></div>
          </div>
        </div>
      </div>

      <!-- SEGMENTATION TAB -->
      <div id="tab-segmentation-content" style="display:none;">
        <div class="grid-2" style="gap:20px;">
          <div class="card">
            <div class="card-header">
              <div class="card-icon" style="background:var(--cyan-glow);color:var(--cyan);">🗂</div>
              <div class="title">Segment Configuration</div>
            </div>
            <div class="card-body">
              <div class="form-group" style="margin-bottom:14px;">
                <label class="form-label-cyber">Total Memory (KB)</label>
                <input id="total-mem" type="number" class="form-control-cyber" value="512" />
              </div>
              <div style="margin-bottom:14px;">
                <label class="form-label-cyber" style="margin-bottom:8px; display:block;">Segments</label>
                <div id="seg-list">
                  <div class="seg-input-row" style="display:flex; gap:8px; margin-bottom:8px;">
                    <input class="form-control-cyber seg-name" placeholder="Name (e.g. Code)" value="Code" style="flex:1;" />
                    <input class="form-control-cyber seg-size" type="number" placeholder="Size KB" value="120" style="width:100px;" />
                  </div>
                  <div class="seg-input-row" style="display:flex; gap:8px; margin-bottom:8px;">
                    <input class="form-control-cyber seg-name" placeholder="Name" value="Data" style="flex:1;" />
                    <input class="form-control-cyber seg-size" type="number" placeholder="Size KB" value="80" style="width:100px;" />
                  </div>
                  <div class="seg-input-row" style="display:flex; gap:8px; margin-bottom:8px;">
                    <input class="form-control-cyber seg-name" placeholder="Name" value="Stack" style="flex:1;" />
                    <input class="form-control-cyber seg-size" type="number" placeholder="Size KB" value="60" style="width:100px;" />
                  </div>
                  <div class="seg-input-row" style="display:flex; gap:8px; margin-bottom:8px;">
                    <input class="form-control-cyber seg-name" placeholder="Name" value="Heap" style="flex:1;" />
                    <input class="form-control-cyber seg-size" type="number" placeholder="Size KB" value="100" style="width:100px;" />
                  </div>
                </div>
                <button class="btn-cyber ghost" style="font-size:11px; padding:4px 12px; margin-top:4px;" onclick="addSegRow()">+ Add Segment</button>
              </div>
              <button class="btn-cyber primary w-full" style="justify-content:center;" onclick="runSegmentation()">▶ Simulate Segmentation</button>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div class="card-icon" style="background:var(--green-glow);color:var(--green);">📊</div>
              <div class="title">Memory Layout</div>
            </div>
            <div class="card-body" id="seg-result">
              <div style="text-align:center;padding:40px;color:var(--text-muted);">Configure and run segmentation</div>
            </div>
          </div>
        </div>
      </div>

      <!-- VIRTUAL MEMORY TAB -->
      <div id="tab-virtual-content" style="display:none;">
        <div class="grid-4" id="vm-stats">
          <div style="text-align:center;padding:40px;color:var(--text-muted);grid-column:1/-1;">Loading virtual memory info...</div>
        </div>
      </div>

    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    requireAuth();
    document.getElementById('sidebar-mount').innerHTML = renderSidebar('memory');
    document.getElementById('topbar-mount').innerHTML  = renderTopbar('Memory Management', 'Paging · Segmentation · Virtual Memory');

    let currentAlgo = 'FIFO';
    let currentTab  = 'paging';

    function switchTab(tab) {
      ['paging','segmentation','virtual'].forEach(t => {
        document.getElementById(`tab-${t}-content`).style.display = t === tab ? '' : 'none';
        document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
      });
      currentTab = tab;
      if (tab === 'virtual') loadVirtualMemory();
    }

    function selectAlgo(algo) {
      currentAlgo = algo;
      ['FIFO','LRU','OPTIMAL'].forEach(a => {
        document.getElementById(`alg-${a.toLowerCase()}`).classList.toggle('active', a === algo);
      });
    }

    function loadDemoPages() {
      document.getElementById('page-string').value = '7,0,1,2,0,3,0,4,2,3,0,3,2,1,2,0,1,7,0,1';
      document.getElementById('num-frames').value = '3';
    }

    async function runPaging() {
      const raw    = document.getElementById('page-string').value;
      const frames = parseInt(document.getElementById('num-frames').value) || 3;
      const pages  = raw.split(/[\s,]+/).map(Number).filter(n => !isNaN(n));

      if (!pages.length) { showToast('Enter a valid page reference string', 'warning'); return; }

      const res = await apiPost('/memory/paging', { frames, pages, algorithm: currentAlgo });
      if (!res?.ok) { showToast('Simulation failed', 'error'); return; }

      const d = res.data.data || res.data;
      document.getElementById('paging-stats').innerHTML = `
        <div class="grid-2" style="gap:12px; margin-bottom:20px;">
          <div class="stat-card red"><div class="stat-label">Page Faults</div><div class="stat-value red" style="font-size:28px;">${d.pageFaults}</div></div>
          <div class="stat-card green"><div class="stat-label">Page Hits</div><div class="stat-value green" style="font-size:28px;">${d.pageHits}</div></div>
        </div>
        <div class="grid-2" style="gap:12px;">
          <div><div class="stat-label">Hit Ratio</div><div class="mono text-cyan" style="font-size:18px;">${(d.hitRatio*100).toFixed(1)}%</div></div>
          <div><div class="stat-label">Fault Ratio</div><div class="mono text-red" style="font-size:18px;">${(d.faultRatio*100).toFixed(1)}%</div></div>
        </div>
        <div style="margin-top:16px;">
          <div class="threat-meter">
            <div class="threat-meter-fill" style="width:${(d.hitRatio*100).toFixed(1)}%; background:var(--green);"></div>
          </div>
          <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">Hit Rate: ${(d.hitRatio*100).toFixed(1)}%</div>
        </div>
      `;

      // Render trace
      const trace = d.trace || [];
      let html = '<div style="min-width:max-content;">';
      trace.forEach((t, i) => {
        html += `<div class="trace-row">
          <div class="trace-label">${t.page}</div>`;
        for (let f = 0; f < frames; f++) {
          const val = t.frames[f] !== undefined ? t.frames[f] : '';
          const cls = val === '' ? '' : t.fault ? (f === t.frames.length-1 ? 'fault' : '') : '';
          html += `<div class="page-frame ${t.fault && val === t.page ? 'fault' : val !== '' ? 'hit' : ''}">${val !== '' ? val : '·'}</div>`;
        }
        html += `<div class="fault-badge ${t.fault ? 'fault' : 'hit'}" style="margin-left:8px;">${t.fault ? 'FAULT' : 'HIT'}</div>`;
        html += '</div>';
      });
      html += '</div>';

      document.getElementById('paging-trace').innerHTML = html;
      document.getElementById('trace-card').style.display = '';
      showToast(`${currentAlgo}: ${d.pageFaults} faults, ${d.pageHits} hits`, 'success');
    }

    function addSegRow() {
      const div = document.createElement('div');
      div.className = 'seg-input-row';
      div.style.cssText = 'display:flex; gap:8px; margin-bottom:8px;';
      div.innerHTML = `
        <input class="form-control-cyber seg-name" placeholder="Name" style="flex:1;" />
        <input class="form-control-cyber seg-size" type="number" placeholder="Size KB" value="50" style="width:100px;" />
      `;
      document.getElementById('seg-list').appendChild(div);
    }

    async function runSegmentation() {
      const totalMemory = parseInt(document.getElementById('total-mem').value) || 512;
      const names = [...document.querySelectorAll('.seg-name')].map(e => e.value.trim()).filter(Boolean);
      const sizes = [...document.querySelectorAll('.seg-size')].map(e => parseInt(e.value)||0);
      const segments = names.map((name, i) => ({ name, limit: sizes[i] || 50 }));

      if (!segments.length) { showToast('Add at least one segment', 'warning'); return; }

      const res = await apiPost('/memory/segmentation', { totalMemory, segments });
      if (!res?.ok) { showToast('Simulation failed', 'error'); return; }

      const d = res.data.data || res.data;
      const usedPct = ((d.usedMemory / d.totalMemory) * 100).toFixed(1);

      let html = `
        <div class="grid-2" style="gap:12px; margin-bottom:20px;">
          <div><div class="stat-label">Used Memory</div><div class="mono text-cyan">${d.usedMemory} KB / ${d.totalMemory} KB</div></div>
          <div><div class="stat-label">Fragmentation</div><div class="mono text-yellow">${d.fragmentation}%</div></div>
        </div>
        <div style="margin-bottom:16px;">
          <div class="stat-label" style="margin-bottom:6px;">Memory Layout</div>
          <div style="display:flex; width:100%; height:40px; border-radius:6px; overflow:hidden; border:1px solid var(--border);">
      `;
      d.segments.forEach(s => {
        const pct = ((s.limit / d.totalMemory) * 100).toFixed(1);
        html += `<div class="seg-bar" style="width:${pct}%; background:${s.color};" title="${s.name}: ${s.limit}KB">${s.name}</div>`;
      });
      const freePct = ((d.freeMemory / d.totalMemory) * 100).toFixed(1);
      if (d.freeMemory > 0) {
        html += `<div class="seg-bar" style="width:${freePct}%; background:var(--bg-hover); color:var(--text-muted);">Free</div>`;
      }
      html += `</div></div>`;

      // Segment table
      html += `<table class="table-cyber"><thead><tr><th>#</th><th>Segment</th><th>Base</th><th>Limit</th><th>End</th></tr></thead><tbody>`;
      d.segments.forEach((s, i) => {
        html += `<tr>
          <td><div style="width:12px;height:12px;border-radius:2px;background:${s.color};display:inline-block;"></div></td>
          <td class="text-bright">${s.name}</td>
          <td class="mono text-cyan">${s.base}</td>
          <td class="mono">${s.limit} KB</td>
          <td class="mono">${s.end}</td>
        </tr>`;
      });
      html += `</tbody></table>`;

      document.getElementById('seg-result').innerHTML = html;
      showToast('Segmentation simulated', 'success');
    }

    async function loadVirtualMemory() {
      const res = await apiGet('/memory/virtual');
      if (!res?.ok) return;
      const d = res.data.data || res.data;
      document.getElementById('vm-stats').innerHTML = `
        <div class="stat-card cyan"><div class="stat-label">Total Physical</div><div class="stat-value cyan" style="font-size:20px;">${d.totalMemory}</div><div class="stat-icon-bg">▦</div></div>
        <div class="stat-card green"><div class="stat-label">Used Memory</div><div class="stat-value green" style="font-size:20px;">${d.usedMemory}</div><div class="stat-icon-bg">▤</div></div>
        <div class="stat-card yellow"><div class="stat-label">Virtual Memory</div><div class="stat-value yellow" style="font-size:20px;">${d.virtualMemory}</div><div class="stat-icon-bg">💾</div></div>
        <div class="stat-card purple"><div class="stat-label">Page Size</div><div class="stat-value" style="color:var(--purple);font-size:20px;">${d.pageSize}</div><div class="stat-icon-bg">📄</div></div>
        <div class="card" style="grid-column:1/-1; padding:20px;">
          <div class="grid-4" style="gap:20px;">
            <div><div class="stat-label">Free Memory</div><div class="mono text-bright">${d.freeMemory}</div></div>
            <div><div class="stat-label">Swap Used</div><div class="mono text-bright">${d.swapUsed}</div></div>
            <div><div class="stat-label">Swap Total</div><div class="mono text-bright">${d.swapTotal}</div></div>
            <div><div class="stat-label">Total Pages</div><div class="mono text-bright">${d.totalPages?.toLocaleString()}</div></div>
          </div>
          <div style="margin-top:16px;">
            <div class="stat-label" style="margin-bottom:6px;">Memory Usage: ${d.memoryUsagePercent}%</div>
            <div class="threat-meter"><div class="threat-meter-fill" style="width:${d.memoryUsagePercent}%; background:var(--cyan);"></div></div>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
